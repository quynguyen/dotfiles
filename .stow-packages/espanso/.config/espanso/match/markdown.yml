matches:
  # Inline code: ;` → `▌`
  - trigger: ";`"
    replace: "`$|$`"
    word: false

  # Code block: ;cb → ```\n▌\n```
  - trigger: ";cb"
    replace: "```\n$|$\n```"
    word: false
    force_clipboard: true

  # Code block with language: ;lang → ```▌\n\n```  (type language, then Enter)
  - trigger: ";lang"
    replace: "```$|$\n\n```"
    word: false
    force_clipboard: true

  # Named code block: ;javascript-cb → ```javascript\n\n```  etc.
  - regex: ";(?P<lang>[a-zA-Z0-9]+)-cb"
    replace: "```{{lang}}\n$|$\n```"
    force_clipboard: true

  # Bold: ;bold → **▌**
  - trigger: ";bold"
    replace: "**$|$**"
    word: false

  # Link: ;link → [▌](url)
  - trigger: ";link"
    replace: "[$|$](url)"
    word: false

  # Strikethrough: ;strike → ~~▌~~
  - trigger: ";strike"
    replace: "~~$|$~~"
    word: false

  # Table skeleton: ;table → 3-row table, cursor in first data cell
  - trigger: ";table"
    replace: "| col1 | col2 |\n|---|---|\n| $|$ | |"
    word: false
    force_clipboard: true

  # Image: ;img → ![▌](url)
  - trigger: ";img"
    replace: "![$|$](url)"
    word: false

  # Checkbox: ;check → - [ ] ▌
  - trigger: ";check"
    replace: "- [ ] $|$"
    word: false

  # Inline math: ;$ → $▌$
  - trigger: ";$"
    replace: "$$|$$"
    word: false

  # Block math: ;b$ → $$\n▌\n$$
  - trigger: ";b$"
    replace: "$$\n$|$\n$$"
    word: false
    force_clipboard: true

  # LaTeX brackets
  - trigger: ";l("
    replace: "\\left( $|$ \\right)"
    word: false

  - trigger: ";l["
    replace: "\\left[ $|$ \\right]"
    word: false

  - trigger: ";l{"
    replace: "\\left\\{ $|$ \\right\\}"
    word: false

  # LaTeX align block: ;align → \begin{align}...\end{align}
  - trigger: ";align"
    replace: "\\begin{align}\n$|$\n\\end{align}"
    word: false
    force_clipboard: true

  # LaTeX fraction: ;frac → \frac{▌}{}
  - trigger: ";frac"
    replace: "\\frac{$|$}{}"
    word: false

  # LaTeX bmatrix: ;matb → \begin{bmatrix}\n▌\n\end{bmatrix}
  - trigger: ";matb"
    replace: "\\begin{bmatrix}\n$|$\n\\end{bmatrix}"
    word: false
    force_clipboard: true

  # LaTeX pmatrix: ;matp → \begin{pmatrix}\n▌\n\end{pmatrix}
  - trigger: ";matp"
    replace: "\\begin{pmatrix}\n$|$\n\\end{pmatrix}"
    word: false
    force_clipboard: true
