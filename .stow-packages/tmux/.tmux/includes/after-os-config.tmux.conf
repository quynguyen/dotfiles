# Settings re-applied after every config file has loaded.
#
# tmux loads ~/.tmux.conf first and $XDG_CONFIG_HOME/tmux/tmux.conf second, so
# on Omarchy the OS's own config silently wins every option both files set.
# ~/.tmux.conf hooks this file onto session-created, which fires after all
# config files are read, to take back the few settings we care about.
#
# Keep this list minimal. Omarchy's status bar restyles itself on
# `omarchy theme set`, so anything reclaimed here stops following the theme.
# Nothing edits Omarchy's file, so `omarchy refresh` and migrations stay safe.

# Our right-hand status: Omarchy's own indicators, but ending in the date and
# time this config has always shown instead of the hostname.
set -g status-right '#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]%a %Y-%m-%d %H:%M '
