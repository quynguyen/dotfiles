#Reload config with r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# True color
set -g default-terminal 'tmux-256color'
#set -ga terminal-overrides ",xterm-256color*:Tc"
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

set-option -g allow-rename off
set-option -g history-limit 50000

set -g base-index 1
set-window-option -g pane-base-index 1
set-window-option -g xterm-keys on
set-window-option -g mode-keys vi

# Direct tmux pane navigation with Option + vim motion keys (bypasses Neovim)
# Note: You may need to configure your terminal to send Option as Meta key
# These ALWAYS control tmux panes, regardless of what's running in the pane
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alternative: Prefix + Shift + vim motion keys for direct tmux navigation
# These work without terminal configuration and ALWAYS control tmux panes
bind H select-pane -L
bind J select-pane -D
bind K select-pane -U
bind L select-pane -R

# Smart pane switching with awareness for Neovim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Fallback for tmux copy mode
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
unbind l
bind l select-pane -R

# Maxmize Pane
unbind-key C-f
bind-key -n C-f resize-pane -Z

# Vi-style visual selection and copying
bind -T copy-mode-vi v send -X begin-selection
# ~/.bin/xcopy picks pbcopy / wl-copy / xclip / xsel for the current platform
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.bin/xcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.bin/xcopy"

# Enable mouse
set -g mouse on

# F12 to toggle off tmux's hot key (ctrl+b) listener.  Useful when a tmux session is nested inside a a tmux session.
# F12 will enable the hotkey captured by the inner tmux, rather than be captured by the outter
source ~/.tmux/includes/toggle_keybindings.tmux.conf

#################################################################################
# dracula theme settings
#################################################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set-option -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'abhinav/tmux-fastcopy'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'tmux-plugins/tmux-sessionist' 

#################################################################################
# dracula theme settings
#################################################################################
# Colour variables needed for F12-Toggle, so that Tmux can be used inside Tmux:
# 	./includes/toggle-local-remote-bindings/toggle_keybindings.tmux.conf
color_status_text="colour245"
color_window_off_status_bg="colour238"
color_light="white" #colour015
color_dark="colour232" # black= colour232
color_window_off_status_current_bg="colour254"
color_window_off_indicator="colour88"

# Powerline separator characters for F12 toggle
separator_powerline_right=""

set -g @plugin 'dracula/tmux'
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-show-powerline true

#################################################################################
# tmux right-side status bar
#################################################################################
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'

#################################################################################
# tmux-jump
#################################################################################
set -g @plugin 'schasse/tmux-jump'
set -g @jump-key 'f'

#################################################################################
# tmux-copycat settings
#################################################################################
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @copycat_git_special  'C-g'
set -g @copycat_file_search 'C-f'
set -g @copycat_url_search 'C-u'
set -g @copycat_digit_search 'C-d'
set -g @copycat_hash_search 'C-h'
set -g @copycat_ip_search 'C-i'

#################################################################################
# tmux-opensettings
#################################################################################

# Open in browser
set -g @open-S 'https://www.google.com/search?q='

#################################################################################
# Must Run-at-ends
#################################################################################
run '~/.tmux/plugins/tpm/tpm'
