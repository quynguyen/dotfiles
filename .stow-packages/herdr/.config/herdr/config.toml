onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "dracula"

auto_switch = false
[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[update]
# Pin both machines to the same channel so devbook (brew) and leopard (omarchy repo)
# converge on one version. --remote requires a compatible protocol on both ends.
channel = "stable"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
# _ looks like a horizontal divider; both spellings cover legacy + kitty encodings
split_horizontal = ["prefix+_", "prefix+shift+minus"]
# | looks like a vertical divider
split_vertical = ["prefix+|", "prefix+shift+backslash", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]

# prefix+ctrl+arrows collided with macOS Mission Control (move a space)
resize_mode = "prefix+ctrl+shift+r"

# Like resize-pane on C-M-S-arrows
resize_pane_left = "prefix+shift+left"
resize_pane_down = "prefix+shift+down"
resize_pane_up = "prefix+shift+up"
resize_pane_right = "prefix+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+r"

# Windows -> tabs
new_tab = "prefix+shift+c"
rename_tab = "prefix+shift+r"
close_tab = "prefix+shift+x"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+shift+h", "prefix+shift+p"]
next_tab = ["prefix+shift+l", "prefix+shift+n"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+ctrl+c"
# worktree workspaces are workspace-level -> ctrl tier (herdr default was prefix+shift+g)
new_worktree = "prefix+ctrl+g"
rename_workspace = "prefix+ctrl+r"
close_workspace = "prefix+ctrl+x"
previous_workspace = ["prefix+shift+k", "prefix+ctrl+p"]
next_workspace = ["prefix+shift+j", "prefix+ctrl+n"]

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

status_indicators = "symbols"
[ui.toast]
delivery = "system"
