format = """\
[](bg:none fg:#bcbcbc)\
$os\
[](fg:#bcbcbc bg:#c792ea)\
$directory\
[](fg:#c792ea bg:#fce94f)\
$git_branch$git_status\
[](fg:#fce94f bg:none)\
$cmd_duration\
$line_break\
$character\
"""

# Platform glyph. The same config is stowed on macOS and on Omarchy, so let
# starship pick the symbol rather than hardcoding one: the Mac keeps its apple
# and Linux boxes get Tux. Styled to match the segment it replaced.
[os]
disabled = false
format = "[$symbol]($style)"
style = "bg:#bcbcbc fg:#282A36"

[os.symbols]
Macos = ""
Arch = ""
Linux = ""

[directory]
format = "[ 󰉋 $path ]($style)"
style = "fg:#ffffff bg:#c792ea"
truncate_to_repo = false

[git_branch]
format = "[  $branch ]($style)"
style = "fg:#282A36 bg:#fce94f"

[git_status]
format = "[ $all_status ]($style)"
style = "fg:#282A36 bg:#fce94f"

[cmd_duration]
format = " [$duration]($style)"
style = "fg:#6272a4"
min_time = 0
show_milliseconds = true

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"